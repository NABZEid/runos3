name: Build RunOS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder Android dan iOS
        run: |
          flutter create --project-name runos --org com.skyy --platforms=android,ios /tmp/scaffold
          cp -r /tmp/scaffold/android /tmp/scaffold/ios .

      - name: Pasang paket
        run: flutter pub get

      - name: Pasang ikon logo RunOS
        run: dart run flutter_launcher_icons

      - name: Tambah izin lokasi
        run: dart tool/patch_platform.dart

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunOS-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Buat Release dan lampirkan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RunOS build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
